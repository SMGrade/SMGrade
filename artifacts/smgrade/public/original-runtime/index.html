  <!-- Poki SDK Shim for offline / local sandbox reliability -->
  <script>
    window.PokiSDK = {
      init: () => Promise.resolve(),
      gameLoadingStart: () => {},
      gameLoadingFinished: () => {},
      gameplayStart: () => {},
      gameplayStop: () => {},
      commercialBreak: () => Promise.resolve(),
      rewardedBreak: () => Promise.resolve(true),
      enableEventTracking: () => {},
      setDebug: () => {}
    };

    // Offline Network Interceptor: Block all remote loadbalancer / server endpoints
    (function() {
      const origXHR = window.XMLHttpRequest.prototype.open;
      window.XMLHttpRequest.prototype.open = function(method, url, ...args) {
        if (typeof url === 'string' && (url.includes('loadbalancer.swordmasters.io') || url.includes('/api/server/') || url.includes('/api/user/'))) {
          console.warn('[SMGrade Standalone Offline] Blocked remote request to:', url, 'FROM STACK:\n' + new Error().stack);
          this._isBlockedRemote = true;
        }
        return origXHR.call(this, method, url, ...args);
      };
      const origSend = window.XMLHttpRequest.prototype.send;
      window.XMLHttpRequest.prototype.send = function(data) {
        if (this._isBlockedRemote) {
          setTimeout(() => {
            Object.defineProperty(this, 'status', { value: 200, writable: false });
            Object.defineProperty(this, 'responseText', { value: JSON.stringify({ success: true, result: { serverIp: '127.0.0.1', port: 2567 } }), writable: false });
            if (typeof this.onload === 'function') this.onload();
            if (typeof this.onreadystatechange === 'function') {
              Object.defineProperty(this, 'readyState', { value: 4, writable: false });
              this.onreadystatechange();
            }
          }, 0);
          return;
        }
        return origSend.call(this, data);
      };
    })();
  </script>
  <script src="playcanvas-stable.min.js"></script>
  <script>
    // Force PlayCanvas to load the local patched __game-scripts.js instead of remote CDN
    if (window.pc && pc.Asset) {
      const _origGetFileUrl = pc.Asset.prototype.getFileUrl;
      pc.Asset.prototype.getFileUrl = function() {
        if (this.type === 'script') {
          return '/original-runtime/__game-scripts.js?v=20261030_v5';
        }
        if (this.id === 300000036 || this.name === 'pet36.png' || this.name === 'xpiggie.png') {
          return '/images/pets/xpiggie.png';
        }
        return _origGetFileUrl.call(this);
      };
      console.log('[SMGrade Standalone Offline] Script and X Piggie asset routing patched');
    }

    // Defensive asset registration for X Piggie (Asset 300000036)
    window.addEventListener('DOMContentLoaded', () => {
      const checkApp = setInterval(() => {
        if (window.pc && pc.app && pc.app.assets) {
          clearInterval(checkApp);
          if (!pc.app.assets.get(300000036)) {
            const asset = new pc.Asset('pet36.png', 'texture', { url: '/images/pets/xpiggie.png' });
            asset.id = 300000036;
            asset.preload = true;
            pc.app.assets.add(asset);
            pc.app.assets.load(asset);
            console.log('[SMGrade] Registered texture asset 300000036 for X Piggie');
          }
        }
      }, 50);
    });
  </script>
